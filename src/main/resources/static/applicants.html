<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Applicants - Job Portal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      transition: all 0.2s ease-in-out;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 40px 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1040px;
      margin: auto;
    }

    h1 {
      color: #0f172a;
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 24px 0;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #1e293b 0%, #059669 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .applicant-card {
      background: white;
      padding: 28px;
      margin-top: 20px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
    }

    .applicant-card h3 {
      color: #0f172a;
      margin-top: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .applicant-card p {
      color: #475569;
      line-height: 1.6;
      font-size: 14px;
      margin: 6px 0;
    }

    select {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      background: #f8fafc;
      outline: none;
    }

    button {
      padding: 10px 20px;
      border-radius: 10px;
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: white;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-left: 8px;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.35);
    }

    .back {
      display: inline-block;
      margin-top: 28px;
      color: #059669;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    #message {
      margin-top: 20px;
      font-weight: 700;
      font-size: 14px;
    }
    /* Shiftboard visual theme */
    :root { --ink: #151923; --paper: #fcfbf7; --warm: #f5ad37; --line: #d8d8c8; --teal: #087b78; }
    * { transition: border-color .16s ease, background-color .16s ease, box-shadow .16s ease, transform .16s ease; }
    body { min-height: 100vh; color: var(--ink); background-color: #151923; background-image: radial-gradient(rgba(255,255,255,.075) 1px, transparent 1px); background-size: 28px 28px; }
    .container { max-width: 1000px; margin: 54px auto; padding: 42px; border-radius: 4px; background: #f3f4ed; box-shadow: 0 16px 0 rgba(0,0,0,.12); }
    h1, h2 { color: var(--ink); } h1 { font-size: 32px; letter-spacing: -.03em; }
    .applicant-card { border: 1px solid var(--line); border-radius: 4px; background: var(--paper); box-shadow: 0 6px 0 rgba(21,25,35,.10); }
    .applicant-card:hover { border-color: var(--warm); transform: translateY(-2px); }
    button { border: 2px solid var(--ink); border-radius: 3px; background: var(--warm); color: var(--ink); box-shadow: none; }
    button:hover { background: #ffc45c; box-shadow: none; }
    .back { color: var(--teal); }
  </style>
</head>
<body>

<div class="container">
  <h1>Applicants</h1>
  <div id="applicantList"></div>
  <p id="message"></p>
  <a class="back" href="/employer-dashboard.html">← Back to Dashboard</a>
</div>

<script>
  const employerId = localStorage.getItem("employerId");
  const jobId = new URLSearchParams(window.location.search).get("jobId");
  const applicantList = document.getElementById("applicantList");
  const message = document.getElementById("message");

  if (!employerId) {
    window.location.href = "/employer-login.html";
  }

  if (!jobId) {
    message.style.color = "red";
    message.textContent = "Job ID is missing.";
  } else {
    loadApplicants();
  }

  async function loadApplicants() {
    try {
      const response = await fetch(
              "/api/employers/" + employerId +
              "/jobs/" + jobId + "/applicants"
      );

      if (!response.ok) {
        throw new Error("Could not load applicants");
      }

      const applicants = await response.json();

      if (applicants.length === 0) {
        message.textContent = "No students have applied for this job yet.";
        return;
      }

      applicantList.innerHTML = applicants.map(applicant => `
                <div class="applicant-card">
                    <h2>${applicant.studentName}</h2>
                    <p><b>Email:</b> ${applicant.studentEmail}</p>
                    <p><b>University:</b> ${applicant.university || "Not added"}</p>
                    <p><b>Skills:</b> ${(applicant.skills || []).join(", ") || "Not added"}</p>
                    <p><b>Education:</b> ${applicant.education || "Not added"}</p>
                    <p><b>Bio:</b> ${applicant.bio || "Not added"}</p>
                    <p><b>Resume:</b> ${applicant.resumeLink || "Not added"}</p>
                    <p><b>One-day availability:</b>
                        ${applicant.availableForOneDay ? "Yes" : "No"}
                    </p>
                    <p><b>Current status:</b> ${applicant.status}</p>

                    <select id="status-${applicant.applicationId}">
                        <option value="PENDING">Pending</option>
                        <option value="INTERVIEW">Interview</option>
                        <option value="SELECTED">Selected</option>
                        <option value="REJECTED">Rejected</option>
                    </select>

                    <button onclick="updateStatus(${applicant.applicationId})">
                        Update Status
                    </button>
                </div>
            `).join("");

      applicants.forEach(applicant => {
        document.getElementById(
                "status-" + applicant.applicationId
        ).value = applicant.status;
      });

    } catch (error) {
      message.style.color = "red";
      message.textContent = error.message;
    }
  }

  async function updateStatus(applicationId) {
    const status = document.getElementById(
            "status-" + applicationId
    ).value;

    try {
      const response = await fetch(
              "/api/employers/" + employerId +
              "/jobs/" + jobId +
              "/applications/" + applicationId + "/status",
              {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({ status: status })
              }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.detail || "Could not update status");
      }

      message.style.color = "green";
      message.textContent = "Application status updated.";
      loadApplicants();

    } catch (error) {
      message.style.color = "red";
      message.textContent = error.message;
    }
  }
</script>

</body>
</html>
