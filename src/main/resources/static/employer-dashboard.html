<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employer Dashboard - Job Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 40px 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1040px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 28px 32px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
            margin-bottom: 32px;
        }

        h1 {
            color: #0f172a;
            margin: 0 0 6px 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #1e293b 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #company {
            color: #64748b;
            margin: 0;
            font-size: 15px;
            font-weight: 600;
        }

        h2 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        button, .button {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
        }

        button:hover, .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.35);
        }

        .secondary {
            background: #f1f5f9 !important;
            color: #475569 !important;
            box-shadow: none !important;
            border: 1px solid #cbd5e1 !important;
            margin-left: 8px;
        }

        .secondary:hover {
            background: #e2e8f0 !important;
            color: #1e293b !important;
        }

        .job-card {
            background: white;
            padding: 28px;
            margin-top: 20px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
        }

        .job-card h3 {
            color: #0f172a;
            font-size: 20px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .job-card p {
            color: #475569;
            line-height: 1.6;
            font-size: 14px;
            margin: 6px 0;
        }

        .message {
            margin-top: 24px;
            font-weight: 700;
            font-size: 15px;
            color: #64748b;
        }
        /* Shiftboard visual theme */
        :root { --ink: #151923; --paper: #fcfbf7; --warm: #f5ad37; --line: #d8d8c8; --teal: #087b78; }
        * { transition: border-color .16s ease, background-color .16s ease, box-shadow .16s ease, transform .16s ease; }
        body { min-height: 100vh; color: var(--ink); background-color: #151923; background-image: radial-gradient(rgba(255,255,255,.075) 1px, transparent 1px); background-size: 28px 28px; }
        .container { max-width: 1100px; margin: 54px auto; padding: 42px; border-radius: 4px; background: #f3f4ed; box-shadow: 0 16px 0 rgba(0,0,0,.12); }
        h1, h2 { color: var(--ink); } h1 { font-size: 32px; letter-spacing: -.03em; }
        .top { border-bottom: 3px solid var(--warm); padding-bottom: 20px; }
        .button, button { border: 2px solid var(--ink); border-radius: 3px; background: var(--warm); color: var(--ink); box-shadow: none; }
        .button:hover, button:hover { background: #ffc45c; box-shadow: none; transform: translateY(-1px); }
        .secondary { background: transparent; }
        .job-card { border: 1px solid var(--line); border-radius: 4px; background: var(--paper); box-shadow: 0 6px 0 rgba(21,25,35,.10); }
        .job-card:hover { border-color: var(--warm); transform: translateY(-2px); }
        .job-card p, .message { color: #50555a; }
    </style>
</head>
<body>

<div class="container">
    <div class="top">
        <div>
            <h1 id="welcome">Employer Dashboard</h1>
            <p id="company"></p>
        </div>
        <div>
            <a class="button" href="/post-job.html">Post a Job</a>
            <button class="secondary" onclick="logout()">Logout</button>
        </div>
    </div>

    <h2>My Posted Jobs</h2>
    <div id="jobList"></div>
    <p id="message" class="message"></p>
</div>

<script>
    const employerId = localStorage.getItem("employerId");
    const employerName = localStorage.getItem("employerName");
    const companyName = localStorage.getItem("companyName");

    if (!employerId) {
        window.location.href = "/employer-login.html";
    }

    document.getElementById("welcome").textContent =
        "Welcome, " + employerName;
    document.getElementById("company").textContent =
        "Company: " + companyName;

    async function loadJobs() {
        const jobList = document.getElementById("jobList");
        const message = document.getElementById("message");

        try {
            const response = await fetch(
                "/api/jobs/employer/" + employerId
            );

            if (!response.ok) {
                throw new Error("Could not load jobs");
            }

            const jobs = await response.json();

            if (jobs.length === 0) {
                message.textContent = "You have not posted any jobs yet.";
                return;
            }

            jobList.innerHTML = jobs.map(job => `
                <div class="job-card">
                    <h3>${job.title}</h3>
                    <p>${job.description}</p>
                    <p><b>Type:</b> ${job.type}</p>
                    <p><b>Pay:</b> Rs. ${job.pay}</p>
                    <p><b>Location:</b> ${job.location}</p>
                    <p><b>Date:</b> ${job.jobDate || "Not specified"}</p>
                    <a class="button"
                       href="/applicants.html?jobId=${job.id}">
                       View Applicants
                    </a>
                </div>
            `).join("");

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;
        }
    }

    function logout() {
        localStorage.removeItem("employerId");
        localStorage.removeItem("employerName");
        localStorage.removeItem("companyName");
        window.location.href = "/employer-login.html";
    }

    loadJobs();
</script>

</body>
</html>
