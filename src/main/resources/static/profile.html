<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Job Portal</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 40px 24px;
            min-height: 100vh;
        }

        .card {
            max-width: 680px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #0f172a;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin: 0 0 24px 0;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #1e293b 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            margin-top: 6px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            color: #0f172a;
            background: #f8fafc;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .checkbox-row {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f5f9;
            padding: 14px 18px;
            border-radius: 12px;
        }

        .checkbox-row input {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .checkbox-row label {
            margin-top: 0;
            color: #334155;
            cursor: pointer;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
        }

        .top-link {
            display: inline-block;
            float: right;
            color: #2563eb;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }

        .top-link:hover {
            text-decoration: underline;
        }
        /* Shiftboard visual theme */
        :root { --ink: #151923; --paper: #fcfbf7; --warm: #f5ad37; --line: #d8d8c8; --teal: #087b78; }
        * { transition: border-color .16s ease, background-color .16s ease, box-shadow .16s ease, transform .16s ease; }
        body { min-height: 100vh; padding: 40px 20px; color: var(--ink); background-color: #151923; background-image: radial-gradient(rgba(255,255,255,.075) 1px, transparent 1px); background-size: 28px 28px; }
        .card { max-width: 610px; padding: 50px 40px 36px; border-radius: 4px; background: var(--paper); box-shadow: 0 16px 0 rgba(0,0,0,.12); position: relative; }
        .card::before { content: ''; width: 24px; height: 24px; position: absolute; top: -16px; left: calc(50% - 12px); border: 3px solid var(--ink); border-radius: 50%; background: var(--warm); box-shadow: 0 0 0 1px var(--warm); }
        h1 { color: var(--ink); background: none; -webkit-text-fill-color: var(--ink); font-size: 29px; margin-bottom: 12px; }
        label { color: var(--ink); font-weight: 700; font-size: 15px; }
        input, select, textarea { border: 1px solid var(--line); border-radius: 3px; background: #fff; padding: 13px 14px; }
        input:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(8,123,120,.12); }
        button { border: 2px solid var(--ink); border-radius: 3px; background: var(--warm); color: var(--ink); box-shadow: none; }
        button:hover { background: #ffc45c; box-shadow: none; transform: translateY(-1px); }
        a { color: var(--teal) !important; }
    </style>
</head>

<body>
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <a href="/student-dashboard.html" style="color: #2563eb; font-weight: 700; text-decoration: none; font-size: 14px;">← Back to Dashboard</a>
        <a href="/login.html" onclick="logout()" style="color: #ef4444; background: #fef2f2; padding: 6px 14px; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: 14px;">Log out</a>
    </div>

    <h1>My Student Profile</h1>

    <form id="profileForm">
        <label for="name">Name</label>
        <input id="name" required>

        <label for="email">Email</label>
        <input id="email" readonly>

        <label for="university">University</label>
        <input id="university" required>

        <label for="skills">Skills (separate with commas)</label>
        <input id="skills" placeholder="Java, Spring Boot, MySQL">

        <label for="bio">Bio</label>
        <textarea id="bio" placeholder="Tell employers about yourself"></textarea>

        <label for="education">Education</label>
        <textarea id="education" placeholder="Example: BSc in Information Technology"></textarea>

        <label for="resumeLink">Resume link</label>
        <input id="resumeLink" type="url" placeholder="https://example.com/resume.pdf">

        <div class="checkbox-row">
            <input id="availableForOneDay" type="checkbox">
            <label for="availableForOneDay">Available for one-day jobs</label>
        </div>

        <button type="submit">Save Profile</button>
    </form>

    <p id="message"></p>
</div>

<script>
    const studentId = localStorage.getItem("studentId");
    const message = document.getElementById("message");

    if (!studentId) {
        alert("Please log in first.");
        window.location.href = "/login.html";
    }

    async function loadProfile() {
        try {
            const response = await fetch(`/api/students/${studentId}`);

            if (!response.ok) {
                throw new Error("Could not load profile.");
            }

            const student = await response.json();

            document.getElementById("name").value = student.name || "";
            document.getElementById("email").value = student.email || "";
            document.getElementById("university").value = student.university || "";
            document.getElementById("skills").value = (student.skills || []).join(", ");
            document.getElementById("bio").value = student.bio || "";
            document.getElementById("education").value = student.education || "";
            document.getElementById("resumeLink").value = student.resumeLink || "";
            document.getElementById("availableForOneDay").checked =
                student.availableForOneDay || false;

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;
        }
    }

    document.getElementById("profileForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const profileData = {
            name: document.getElementById("name").value.trim(),
            university: document.getElementById("university").value.trim(),
            skills: document.getElementById("skills").value
                .split(",")
                .map(skill => skill.trim())
                .filter(skill => skill !== ""),
            bio: document.getElementById("bio").value.trim(),
            education: document.getElementById("education").value.trim(),
            resumeLink: document.getElementById("resumeLink").value.trim(),
            availableForOneDay: document.getElementById("availableForOneDay").checked
        };

        try {
            const response = await fetch(`/api/students/${studentId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(profileData)
            });

            if (!response.ok) {
                throw new Error("Profile update failed.");
            }

            message.style.color = "green";
            message.textContent = "Profile updated successfully.";

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;
        }
    });

    function logout() {
        localStorage.removeItem("studentId");
        localStorage.removeItem("studentName");
    }

    loadProfile();
</script>
</body>
</html>
