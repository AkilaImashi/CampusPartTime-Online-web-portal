<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employer Registration - Job Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            color: #0f172a;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
            padding: 40px 36px;
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #0f172a;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin: 0 0 24px 0;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #1e293b 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin-top: 6px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            color: #0f172a;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #059669;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.15);
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.4);
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }

        .link {
            text-align: center;
            margin-top: 16px;
        }
        /* Shiftboard visual theme */
        :root { --ink: #171A21; --ink-soft: #2B303B; --paper: #F0F2EA; --paper-alt: #E5E8DD; --card: #FBFBF7; --line: #D6D9CB; --warm: #F0A93C; --warm-dark: #C77F17; --coral: #E35D45; --teal: #1E7A6C; --danger: #C0392B; --text: #1B1E24; --text-soft: #565C4E; }
        * { transition: border-color .16s ease, background-color .16s ease, box-shadow .16s ease, transform .16s ease; }
        body { min-height: 100vh; padding: 132px 20px 40px; color: var(--text); background-color: var(--ink); background-image: radial-gradient(rgba(255,255,255,.075) 1px, transparent 1px); background-size: 28px 28px; }
        .site-header { height: 80px; position: fixed; inset: 0 0 auto; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 0 max(24px, calc((100% - 1320px) / 2)); border-bottom: 3px solid var(--warm); background: var(--ink); }.brand { color: var(--card) !important; font-size: 25px; font-weight: 800; text-decoration: none; }.brand::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 10px; border: 3px solid #624817; border-radius: 50%; background: var(--warm); vertical-align: 2px; }.header-link { color: var(--card) !important; font-weight: 700; text-decoration: none; }
        .card { max-width: 610px; padding: 50px 40px 36px; border-radius: 4px; background: var(--card); box-shadow: 0 16px 0 rgba(0,0,0,.12); position: relative; }
        .card::before { content: ''; width: 24px; height: 24px; position: absolute; top: -16px; left: calc(50% - 12px); border: 3px solid var(--ink); border-radius: 50%; background: var(--warm); box-shadow: 0 0 0 1px var(--warm); }
        h1 { color: var(--ink); background: none; -webkit-text-fill-color: var(--ink); font-size: 29px; margin-bottom: 12px; }
        label { color: var(--ink); font-weight: 700; font-size: 15px; }
        input, select, textarea { border: 1px solid var(--line); border-radius: 3px; background: #fff; padding: 13px 14px; }
        input:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(8,123,120,.12); }
        button { border: 2px solid var(--ink); border-radius: 3px; background: var(--warm); color: var(--ink); box-shadow: none; }
        button:hover { background: var(--warm-dark); box-shadow: none; transform: translateY(-1px); }
        a { color: var(--teal) !important; }
        .subtitle { margin: 0 0 30px; color: var(--text-soft); text-align: center; }.role-tabs { display: grid; grid-template-columns: repeat(2, 1fr); margin: 0 0 26px; padding: 4px; border-radius: 3px; background: var(--paper-alt); }.role-tabs a { padding: 12px 8px; border-radius: 3px; color: var(--text-soft) !important; font-weight: 700; text-align: center; text-decoration: none; }.role-tabs a.active { background: var(--ink); color: var(--card) !important; }.link { color: var(--text-soft); }.link a { font-weight: 700; }
    </style>
</head>
<body>

<header class="site-header"><a class="brand" href="/index.html">Shiftboard</a><a class="header-link" href="/login.html">Log in instead</a></header>

<div class="card">
    <h1>Create your account</h1>
    <p class="subtitle">Admin accounts are pre-seeded — students and employers sign up here.</p>
    <nav class="role-tabs" aria-label="Registration role"><a href="/register.html">I'm a student</a><a class="active" href="/employer-register.html">I'm an employer</a></nav>

    <form id="registerForm">
        <label for="name">Name</label>
        <input id="name" required>

        <label for="email">Email</label>
        <input id="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" required>

        <label for="companyName">Company Name</label>
        <input id="companyName" required>

        <label for="contactNumber">Contact Number</label>
        <input id="contactNumber" required>

        <button type="submit">Register as Employer</button>
    </form>

    <p id="message"></p>

    <p class="link">
        Already have an account? <a href="/employer-login.html">Log in</a>
    </p>
</div>

<script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const employer = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            companyName: document.getElementById("companyName").value,
            contactNumber: document.getElementById("contactNumber").value
        };

        try {
            const response = await fetch("/api/auth/register/employer", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(employer)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || data.message || "Registration failed");
            }

            message.style.color = "green";
            message.textContent =
                "Registration successful. Please log in.";
            form.reset();

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;
        }
    });
</script>

</body>
</html>
