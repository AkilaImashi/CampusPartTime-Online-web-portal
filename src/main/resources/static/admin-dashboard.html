<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Job Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 40px 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #0f172a;
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 6px 0;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #1e293b 0%, #dc2626 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #64748b;
            font-size: 15px;
            margin-top: 0;
            margin-bottom: 24px;
        }

        h2 {
            color: #1e293b;
            font-size: 20px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 16px;
        }

        .section {
            background: white;
            margin-top: 28px;
            padding: 32px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 14px;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f1f5f9;
            color: #334155;
            font-weight: 700;
            border-top: 1px solid #e2e8f0;
        }

        td {
            color: #475569;
        }

        tr:hover td {
            background: #f8fafc;
        }

        button {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.25);
        }

        button:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        #message {
            margin-top: 24px;
            font-weight: 700;
            font-size: 14px;
        }
        /* Shiftboard visual theme */
        :root { --ink: #171A21; --ink-soft: #2B303B; --paper: #F0F2EA; --paper-alt: #E5E8DD; --card: #FBFBF7; --line: #D6D9CB; --warm: #F0A93C; --warm-dark: #C77F17; --coral: #E35D45; --teal: #1E7A6C; --danger: #C0392B; --text: #1B1E24; --text-soft: #565C4E; }
        * { transition: border-color .16s ease, background-color .16s ease, box-shadow .16s ease, transform .16s ease; }
        body { min-height: 100vh; color: var(--ink); background-color: #151923; background-image: radial-gradient(rgba(255,255,255,.075) 1px, transparent 1px); background-size: 28px 28px; }
        .container { max-width: 1150px; margin: 54px auto; padding: 42px; border-radius: 4px; background: #f3f4ed; box-shadow: 0 16px 0 rgba(0,0,0,.12); }
        h1, h2 { color: var(--ink); } h1 { font-size: 32px; letter-spacing: -.03em; }
        .section { border: 1px solid var(--line); border-radius: 4px; background: var(--paper); box-shadow: 0 6px 0 rgba(21,25,35,.10); }
        table { border-color: var(--line); } th { background: #e6e9df; color: var(--ink); } td { border-color: var(--line); }
        button { border: 2px solid var(--ink); border-radius: 3px; background: var(--warm); color: var(--ink); box-shadow: none; }
        button:hover { background: #ffc45c; box-shadow: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Admin Dashboard</h1>
    <p>Manage portal users and job posts.</p>

    <div class="section">
        <h2>All Users</h2>
        <div id="userTable"></div>
    </div>

    <div class="section">
        <h2>All Jobs</h2>
        <div id="jobTable"></div>
    </div>

    <p id="message"></p>
</div>

<script>
    const adminId = localStorage.getItem("adminId");

    if (!adminId) {
        window.location.href = "/admin-login.html";
    }
    const message = document.getElementById("message");

    async function loadData() {
        try {
            const userResponse = await fetch("/api/admin/users");
            const jobResponse = await fetch("/api/admin/jobs");

            if (!userResponse.ok || !jobResponse.ok) {
                throw new Error("Could not load admin data");
            }

            const users = await userResponse.json();
            const jobs = await jobResponse.json();

            document.getElementById("userTable").innerHTML = `
                <table>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>
                    ${users.map(user => `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.role}</td>
                            <td>
                                <button onclick="deleteUser(${user.id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `).join("")}
                </table>
            `;

            document.getElementById("jobTable").innerHTML = `
                <table>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Employer</th>
                        <th>Type</th>
                        <th>Location</th>
                        <th>Action</th>
                    </tr>
                    ${jobs.map(job => `
                        <tr>
                            <td>${job.id}</td>
                            <td>${job.title}</td>
                            <td>${job.companyName}</td>
                            <td>${job.type}</td>
                            <td>${job.location}</td>
                            <td>
                                <button onclick="deleteJob(${job.id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `).join("")}
                </table>
            `;

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;
        }
    }

    async function deleteUser(userId) {
        if (!confirm("Delete this user?")) {
            return;
        }

        const response = await fetch("/api/admin/users/" + userId, {
            method: "DELETE"
        });

        if (response.ok) {
            message.style.color = "green";
            message.textContent = "User deleted successfully.";
            loadData();
        } else {
            message.style.color = "red";
            message.textContent = "Could not delete user.";
        }
    }

    async function deleteJob(jobId) {
        if (!confirm("Delete this job?")) {
            return;
        }

        const response = await fetch("/api/admin/jobs/" + jobId, {
            method: "DELETE"
        });

        if (response.ok) {
            message.style.color = "green";
            message.textContent = "Job deleted successfully.";
            loadData();
        } else {
            message.style.color = "red";
            message.textContent = "Could not delete job.";
        }
    }

    loadData();
</script>

</body>
</html>
