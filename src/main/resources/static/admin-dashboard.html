<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Job Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 30px; }
        .container { max-width: 1100px; margin: auto; }
        h1, h2 { color: #1f3c88; }
        .section {
            background: white; margin-top: 22px; padding: 20px;
            border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,.1);
        }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 11px; border: 1px solid #ddd; text-align: left; }
        th { background: #1f3c88; color: white; }
        button {
            background: #c0392b; color: white; border: none; border-radius: 5px;
            padding: 8px 12px; cursor: pointer;
        }
        #message { margin-top: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Admin Dashboard</h1>
    <p>Manage portal users and job posts.</p>

    <div class="section">
        <h2>All Users</h2>
        <div id="userTable"></div>
    </div>

    <div class="section">
        <h2>All Jobs</h2>
        <div id="jobTable"></div>
    </div>

    <p id="message"></p>
</div>

<script>
    const adminId = localStorage.getItem("adminId");

    if (!adminId) {
        window.location.href = "/admin-login.html";
    }
    const message = document.getElementById("message");

    async function loadData() {
        try {
            const userResponse = await fetch("/api/admin/users");
            const jobResponse = await fetch("/api/admin/jobs");

            if (!userResponse.ok || !jobResponse.ok) {
                throw new Error("Could not load admin data");
            }

            const users = await userResponse.json();
            const jobs = await jobResponse.json();

            document.getElementById("userTable").innerHTML = `
                <table>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>
                    ${users.map(user => `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.role}</td>
                            <td>
                                <button onclick="deleteUser(${user.id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `).join("")}
                </table>
            `;

            document.getElementById("jobTable").innerHTML = `
                <table>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Employer</th>
                        <th>Type</th>
                        <th>Location</th>
                        <th>Action</th>
                    </tr>
                    ${jobs.map(job => `
                        <tr>
                            <td>${job.id}</td>
                            <td>${job.title}</td>
                            <td>${job.companyName}</td>
                            <td>${job.type}</td>
                            <td>${job.location}</td>
                            <td>
                                <button onclick="deleteJob(${job.id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `).join("")}
                </table>
            `;

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;
        }
    }

    async function deleteUser(userId) {
        if (!confirm("Delete this user?")) {
            return;
        }

        const response = await fetch("/api/admin/users/" + userId, {
            method: "DELETE"
        });

        if (response.ok) {
            message.style.color = "green";
            message.textContent = "User deleted successfully.";
            loadData();
        } else {
            message.style.color = "red";
            message.textContent = "Could not delete user.";
        }
    }

    async function deleteJob(jobId) {
        if (!confirm("Delete this job?")) {
            return;
        }

        const response = await fetch("/api/admin/jobs/" + jobId, {
            method: "DELETE"
        });

        if (response.ok) {
            message.style.color = "green";
            message.textContent = "Job deleted successfully.";
            loadData();
        } else {
            message.style.color = "red";
            message.textContent = "Could not delete job.";
        }
    }

    loadData();
</script>

</body>
</html>
