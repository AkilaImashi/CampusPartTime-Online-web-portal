<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration - Job Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            color: #0f172a;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
            padding: 40px 36px;
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #0f172a;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin: 0 0 24px 0;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #1e293b 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin-top: 6px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            color: #0f172a;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        }

        button:active {
            transform: translateY(0);
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Student Registration</h1>

    <form id="registerForm">
        <label for="name">Name</label>
        <input id="name" required>

        <label for="email">Email</label>
        <input id="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" required>

        <label for="university">University</label>
        <input id="university" required>

        <label for="skills">Skills (separate with commas)</label>
        <input id="skills" placeholder="Java, Spring Boot, MySQL">

        <button type="submit">Register</button>
    </form>

    <p id="message"></p>

    <div style="margin-top: 20px; text-align: center;">
        <p style="color: #555; margin-bottom: 0;">Already have an account?</p>
        <a href="/login.html" style="color: #1f3c88; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 6px;">Login here</a>
    </div>
</div>

<script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const skillsText = document.getElementById("skills").value;

        const student = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            university: document.getElementById("university").value,
            skills: skillsText
                .split(",")
                .map(skill => skill.trim())
                .filter(skill => skill !== "")
        };

        try {
            const response = await fetch("/api/auth/register/student", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || data.message || "Registration failed");
            }

            message.style.color = "green";
            message.textContent = "Registration successful! Redirecting to login...";
            form.reset();

            setTimeout(() => {
                window.location.href = "/login.html";
            }, 1500);

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;
        }
    });
</script>

</body>
</html>
