<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post Job - Job Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 40px 24px;
            min-height: 100vh;
        }

        .card {
            max-width: 580px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #0f172a;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin: 0 0 24px 0;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #1e293b 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            margin-top: 6px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            color: #0f172a;
            background: #f8fafc;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #059669;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.15);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.4);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #059669;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
        }
        /* Shiftboard visual theme */
        :root { --ink: #171A21; --ink-soft: #2B303B; --paper: #F0F2EA; --paper-alt: #E5E8DD; --card: #FBFBF7; --line: #D6D9CB; --warm: #F0A93C; --warm-dark: #C77F17; --coral: #E35D45; --teal: #1E7A6C; --danger: #C0392B; --text: #1B1E24; --text-soft: #565C4E; }
        * { transition: border-color .16s ease, background-color .16s ease, box-shadow .16s ease, transform .16s ease; }
        body { min-height: 100vh; padding: 40px 20px; color: var(--ink); background-color: #151923; background-image: radial-gradient(rgba(255,255,255,.075) 1px, transparent 1px); background-size: 28px 28px; }
        .card { max-width: 610px; padding: 50px 40px 36px; border-radius: 4px; background: var(--paper); box-shadow: 0 16px 0 rgba(0,0,0,.12); position: relative; }
        .card::before { content: ''; width: 24px; height: 24px; position: absolute; top: -16px; left: calc(50% - 12px); border: 3px solid var(--ink); border-radius: 50%; background: var(--warm); box-shadow: 0 0 0 1px var(--warm); }
        h1 { color: var(--ink); background: none; -webkit-text-fill-color: var(--ink); font-size: 29px; margin-bottom: 12px; }
        label { color: var(--ink); font-weight: 700; font-size: 15px; }
        input, select, textarea { border: 1px solid var(--line); border-radius: 3px; background: #fff; padding: 13px 14px; }
        input:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(8,123,120,.12); }
        button { border: 2px solid var(--ink); border-radius: 3px; background: var(--teal); color: var(--card); box-shadow: none; }
        button:hover { background: #166358; box-shadow: none; transform: translateY(-1px); }
        a { color: var(--teal) !important; }
    </style>
</head>
<body>

<div class="card">
    <h1>Post a Job</h1>

    <form id="jobForm">
        <label for="title">Job Title</label>
        <input id="title" required>

        <label for="description">Description</label>
        <textarea id="description" required></textarea>

        <label for="type">Job Type</label>
        <select id="type" required>
            <option value="ONE_DAY">One-Day Job</option>
            <option value="LONG_TERM">Long-Term Job</option>
        </select>

        <label for="pay">Pay (Rs.)</label>
        <input id="pay" type="number" min="0" step="0.01" required>

        <label for="jobDate">Job Date</label>
        <input id="jobDate" type="date">

        <label for="location">Location</label>
        <input id="location" required>

        <button type="submit">Post Job</button>
    </form>

    <p id="message"></p>
    <a class="back" href="/employer-dashboard.html">Back to Dashboard</a>
</div>

<script>
    const employerId = localStorage.getItem("employerId");

    if (!employerId) {
        window.location.href = "/employer-login.html";
    }

    document.getElementById("jobForm").addEventListener(
        "submit",
        async function (event) {
            event.preventDefault();

            const job = {
                employerId: Number(employerId),
                title: document.getElementById("title").value,
                description: document.getElementById("description").value,
                type: document.getElementById("type").value,
                pay: Number(document.getElementById("pay").value),
                jobDate: document.getElementById("jobDate").value || null,
                location: document.getElementById("location").value
            };

            const message = document.getElementById("message");

            try {
                const response = await fetch("/api/jobs", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(job)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Could not post job");
                }

                message.style.color = "green";
                message.textContent = "Job posted successfully.";

                setTimeout(function () {
                    window.location.href = "/employer-dashboard.html";
                }, 1000);

            } catch (error) {
                message.style.color = "red";
                message.textContent = error.message;
            }
        }
    );
</script>

</body>
</html>
